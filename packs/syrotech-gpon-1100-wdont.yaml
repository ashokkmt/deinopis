apiVersion: dino.io/v1
kind: LogSource
metadata:
  name: syrotech-gpon-1100-wdont
  version: 0.1.0
  description: "SyroTech SY-GPON-1100-WDONT short-form kernel syslog messages"
  author: DEINOPIS Owner
spec:
  sourceCategory: network_device
  format: syslog
  match:
    # Match the component tag rather than the condition-specific warning body.
    regex: '(?i)^\s*kernel:\s+.+$'
  fields:
    event_message:
      from: message
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
