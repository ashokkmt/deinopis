name: deinopis-simulation

services:
  # Core DEINOPIS Universal Log Vault
  deinopis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deinopis-core
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
      - "8080:8080/tcp"
      - "9090:9090/tcp"
    volumes:
      - deinopis-data:/data
      - deinopis-packs:/deinopis/packs
      - deinopis-sources:/deinopis/sources
      - deinopis-sinks:/deinopis/sinks
    environment:
      - DEINOPIS_LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - deinopis-net

  # 1. Simulates Palo Alto Firewall sending Syslog UDP
  sim-firewall:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-firewall
    command: ["--source", "firewall", "--scenario", "mixed", "--format", "syslog-udp", "--target", "deinopis:1514", "--rate", "2", "--count", "0"]
    depends_on:
      - deinopis
    restart: unless-stopped
    networks:
      - deinopis-net

  # 2. Simulates Cisco ASA Firewall sending Syslog UDP
  sim-asa:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-asa
    command: ["--source", "asa", "--scenario", "mixed", "--format", "syslog-udp", "--target", "deinopis:1514", "--rate", "2", "--count", "0"]
    depends_on:
      - deinopis
    restart: unless-stopped
    networks:
      - deinopis-net

  # 3. Simulates Linux SSHD / auth.log streaming Syslog TCP
  sim-sshd:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-sshd
    command: ["--source", "sshd", "--scenario", "bruteforce", "--format", "syslog-tcp", "--target", "deinopis:1514", "--rate", "1", "--count", "0"]
    depends_on:
      - deinopis
    restart: unless-stopped
    networks:
      - deinopis-net

  # 4. Simulates Suricata/Snort IDS alerts in CEF over Syslog UDP
  sim-ids:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-ids
    command: ["--source", "ids", "--scenario", "scan", "--format", "syslog-udp", "--target", "deinopis:1514", "--rate", "1", "--count", "0"]
    depends_on:
      - deinopis
    restart: unless-stopped
    networks:
      - deinopis-net

  # 5. Simulates Nginx Web Server writing Combined Log Format to spool inbox
  sim-webserver:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-webserver
    command: ["--source", "webserver", "--scenario", "mixed", "--format", "file", "--output-dir", "/data/inbox", "--rate", "2", "--count", "0"]
    volumes:
      - deinopis-data:/data
    depends_on:
      - deinopis
    restart: unless-stopped
    networks:
      - deinopis-net

  # 6. Simulates Payment Gateway microservice posting JSON events via HTTP REST
  sim-app:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-app
    command: ["--source", "app", "--scenario", "mixed", "--format", "http-post", "--target", "http://deinopis:8080/api/v1/ingest", "--rate", "4", "--count", "0"]
    depends_on:
      - deinopis
    restart: unless-stopped
    networks:
      - deinopis-net

  # 7. Simulates Database Server generating CSV audit logs into spool inbox
  sim-database:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-database
    command: ["--source", "database", "--scenario", "mixed", "--format", "file", "--output-dir", "/data/inbox", "--rate", "1", "--count", "0"]
    volumes:
      - deinopis-data:/data
    depends_on:
      - deinopis
    restart: unless-stopped
    networks:
      - deinopis-net


networks:
  deinopis-net:
    driver: bridge

volumes:
  deinopis-data:
  deinopis-packs:
  deinopis-sources:
  deinopis-sinks:
