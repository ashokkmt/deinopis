apiVersion: dino.io/v1
kind: Source
metadata:
  name: raw-kafka-stream
  version: 1.0.0
  description: Kafka consumer group input adapter for raw event intake
spec:
  type: kafka_input
  enabled: false
  brokers:
    - kafka:9092
  topic: deinopis.raw.events
  consumerGroup: deinopis-core-workers
  secretRef: kafka-client-auth
